# 「今天吃啥」Nginx 反向代理示例
#
# 用途：把应用层已经做过的 gzip / 缓存策略再往前推一层，
#       补齐 HTTP/2、TLS、brotli 与真实客户端 IP。
# 使用：替换域名与证书路径后 include 到 nginx.conf 的 http {} 中。
# 注意：应用已自带 gzip，Nginx 只在响应未压缩时才压，不会重复压缩。

upstream today_eat {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name eat.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name eat.example.com;

    ssl_certificate     /etc/letsencrypt/live/eat.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eat.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    client_max_body_size 1m;

    # 文本压缩（brotli 需 ngx_brotli 模块；没有就只开 gzip）
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    # brotli on;
    # brotli_comp_level 5;
    # brotli_types text/css application/javascript application/json image/svg+xml;

    # 打包产物：URL 自带内容哈希，可长期缓存
    location /assets/ {
        proxy_pass http://today_eat;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 图片与图标：一周缓存，减少重复访问
    location /static/ {
        alias /srv/today_eat/static/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    location / {
        proxy_pass http://today_eat;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
    }
}

# 部署后在应用侧设置：
#   TRUST_PROXY=1
#   SESSION_COOKIE_SECURE=1
#   DATABASE_PATH=/srv/today_eat/data/app.db
